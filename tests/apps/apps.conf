# What the shared package test checks for each app once it's started (see README.md). One line per app:
#     <app>  <check>  [reason]
# where <check> is:
#     port:<n>     it answers on that TCP port on the NAS once started (within 120 seconds), and not once stopped
#     cmd:<cmd>    that command works once installed (e.g. its program's version, through the links it makes)
#     lifecycle    only install, start, stop and removal: what it runs needs the NAS itself (the reason says what)
# Apps not listed here aren't tested (the template is a starting point, not an app).
adminer            lifecycle     it runs on the PHP app's PHP or the NAS's own (tests/common/run.sh adminer has both)
audiobookshelf     port:13378
bookstack          lifecycle     it needs the PHP app and MariaDB (tests/common/run.sh bookstack has both)
bugsink            port:8000
calibre-web        port:8083
compass-web        lifecycle     it needs the MongoDB app (tests/common/run.sh compass-web installs both)
copyparty          port:3923
docker             lifecycle     Docker's daemon needs the NAS's kernel (its modules, cgroups)
entware            lifecycle     it mounts /opt on the NAS's volume
forgejo            port:3002
golang             cmd:go version
grafana            port:3000
headlamp           port:4466
icecast            port:8010
jellyfin           port:8096
k3s                cmd:kubectl version --client
kopia              port:51515
kvweb              lifecycle     it waits for the Valkey app (tests/common/run.sh kvweb installs both)
loki               port:3100
mailpit            port:8025
mariadb            lifecycle     it runs under WD's own startup-mysql
mongodb            port:27017
music-assistant    port:8095
mysqld_exporter    port:9104
nano               cmd:nano --version
navidrome          port:4533
nginx              port:443
node_exporter      port:9100
nodejs             cmd:node --version
ntfy               port:2586
openssh            lifecycle     it runs under WD's own ssh_daemon (tests/openssh has a stand-in for it)
paperless-ngx      lifecycle     it waits for the Valkey app (tests/common/run.sh paperless-ngx installs both)
pgweb              port:8081
phpbb              lifecycle     it needs the PHP app and MariaDB (tests/common/run.sh phpbb has both)
php                lifecycle     it swaps WD's own PHP (php-fpm.sh, its pages)
phpMyAdmin         lifecycle     it's served by WD's own web server
postgres_exporter  port:9187
postgresql         port:5432
prometheus         port:9090
python             cmd:python3 --version
redis_exporter     port:9121
ruby               cmd:ruby --version
store              lifecycle     it replaces WD's Apps page (bind mount over WD's files)
syncthing          port:8384
tailscale          lifecycle     it needs the NAS's network and a login
tautulli           port:8181
transmission       port:9091
uptime-kuma        port:3001
valkey             port:6379
vaultwarden        port:8222
wikijs             lifecycle     it waits for the PostgreSQL app (tests/common/run.sh wikijs installs both)
wireguard          cmd:wg show wg0
