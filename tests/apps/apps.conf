# What the shared package test checks for each app once it's started (see README.md). One line per app:
#     <app>  <check>  [reason]
# where <check> is:
#     port:<n>     it answers on that TCP port on the NAS once started (within 120 seconds), and not once stopped
#     cmd:<cmd>    that command works once installed (e.g. its program's version, through the links it makes)
#     lifecycle    only install, start, stop and removal: what it runs needs the NAS itself (the reason says what)
# Apps not listed here aren't tested (the template is a starting point, not an app).
audiobookshelf   port:13378
calibre-web      port:8083
copyparty        port:3923
docker           lifecycle   Docker's daemon needs the NAS's kernel (its modules, cgroups)
entware          lifecycle   it mounts /opt on the NAS's volume
forgejo          port:3002
golang           cmd:go version
grafana          port:3000
icecast          port:8000
jellyfin         port:8096
kopia            port:51515
loki             port:3100
mailpit          port:8025
mariadb          lifecycle   it runs under WD's own startup-mysql
music-assistant  port:8095
nano             cmd:nano --version
navidrome        port:4533
nginx            port:443
node_exporter    port:9100
nodejs           cmd:node --version
ntfy             port:2586
php              lifecycle   it swaps WD's own PHP (php-fpm.sh, its pages)
phpMyAdmin       lifecycle   it's served by WD's own web server
postgresql       port:5432
prometheus       port:9090
python           cmd:python3 --version
store            lifecycle   it replaces WD's Apps page (bind mount over WD's files)
syncthing        port:8384
tailscale        lifecycle   it needs the NAS's network and a login
uptime-kuma      port:3001
valkey           port:6379
vaultwarden      port:8222
wireguard        cmd:wg show wg0
