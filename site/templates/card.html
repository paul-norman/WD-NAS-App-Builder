                    <article class="card"$data data-name="$search_name" data-summary="$search_summary" data-categories="$categories"$security_data>
                        <a class="card-link" href="$page">
                            <img class="app-icon" src="$icon" alt="" width="56" height="56" loading="lazy">
                            <span class="card-title">$name</span>
                            <span class="card-version">$version</span>
                        </a>
                        <p class="card-summary">$summary</p>
                        <p class="badges">$security$publisher$badges</p>
                        <p class="card-actions">$action<a class="button" href="$page">Details</a></p>
                        <p class="card-unavailable">Not available for your NAS</p>
                    </article>
