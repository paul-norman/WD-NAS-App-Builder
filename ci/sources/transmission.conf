# The components transmission's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
curl          curl                              -                                                                                                      https://curl.se/download/curl-${CURL_VERSION}.tar.xz
transmission  GPL-2.0-only OR GPL-3.0-only      https://github.com/transmission/transmission/releases/download/${VERSION}/transmission-${VERSION}.tar.xz  https://github.com/transmission/transmission/releases/download/${VERSION}/transmission-${VERSION}.tar.xz
openssl       Apache-2.0                        -                                                                                                      https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz
zlib          Zlib                              -                                                                                                      https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz
