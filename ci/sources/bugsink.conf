# The components bugsink's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
# Bugsink and its packages come from PyPI (static/bugsink/requirements.txt), whose copyleft ones the release finds by itself
python-build-standalone  PSF-2.0              -  https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_RELEASE}/cpython-${PYTHON_VERSION}+${PYTHON_RELEASE}-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
python-build-standalone  PSF-2.0              -  https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_RELEASE}/cpython-${PYTHON_VERSION}+${PYTHON_RELEASE}-armv7-unknown-linux-gnueabihf-install_only_stripped.tar.gz
uv                       MIT OR Apache-2.0    -  https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-musl.tar.gz
# Build tools for the ARM models' Rust packages (Zig also links the run-as helper and the Python launcher)
maturin                  MIT OR Apache-2.0    -  https://github.com/PyO3/maturin/releases/download/v${MATURIN_VERSION}/maturin-x86_64-unknown-linux-musl.tar.gz
zig                      MIT                  -  https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz
