# The components icecast's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
ezstream  GPL-2.0-only              https://downloads.xiph.org/releases/ezstream/ezstream-${EZSTREAM_VERSION}.tar.gz                 https://downloads.xiph.org/releases/ezstream/ezstream-${EZSTREAM_VERSION}.tar.gz
ffmpeg    LGPL-2.1-or-later         https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz                                      https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz
icecast   GPL-2.0-only              https://downloads.xiph.org/releases/icecast/icecast-${VERSION}.tar.gz                            https://downloads.xiph.org/releases/icecast/icecast-${VERSION}.tar.gz
lame      LGPL-2.0-or-later         https://downloads.sourceforge.net/project/lame/lame/${LAME_VERSION}/lame-${LAME_VERSION}.tar.gz  https://downloads.sourceforge.net/project/lame/lame/${LAME_VERSION}/lame-${LAME_VERSION}.tar.gz
libigloo  LGPL-2.0-or-later         https://downloads.xiph.org/releases/igloo/libigloo-${IGLOO_VERSION}.tar.gz                       https://downloads.xiph.org/releases/igloo/libigloo-${IGLOO_VERSION}.tar.gz
libshout  LGPL-2.0-or-later         https://downloads.xiph.org/releases/libshout/libshout-${SHOUT_VERSION}.tar.gz                    https://downloads.xiph.org/releases/libshout/libshout-${SHOUT_VERSION}.tar.gz
rhash     0BSD                      -                                                                                                https://github.com/rhash/RHash/archive/refs/tags/v${RHASH_VERSION}.tar.gz
taglib    LGPL-2.1-only OR MPL-1.1  https://taglib.org/releases/taglib-${TAGLIB_VERSION}.tar.gz                                      https://taglib.org/releases/taglib-${TAGLIB_VERSION}.tar.gz
# Other sites' copies of ffmpeg's very same file (tried if ffmpeg.org fails): its source is ffmpeg's line
ffmpeg-debian-copy  n/a  -  https://deb.debian.org/debian/pool/main/f/ffmpeg/ffmpeg_${FFMPEG_VERSION}.orig.tar.xz
ffmpeg-alpine-copy  n/a  -  https://distfiles.alpinelinux.org/distfiles/edge/ffmpeg-${FFMPEG_VERSION}.tar.xz
alpine-archive  n/a  -  https://dl-cdn.alpinelinux.org/alpine/v3.22/main
alpine-archive  n/a  -  https://dl-cdn.alpinelinux.org/alpine/v3.22/community
