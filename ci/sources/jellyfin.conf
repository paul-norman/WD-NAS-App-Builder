# The components jellyfin's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
debian-archive   n/a               -                                                                                           http://archive.debian.org/debian
debian-archive   n/a               -                                                                                           http://archive.debian.org/debian-security
jellyfin         GPL-2.0-only      https://github.com/jellyfin/jellyfin/archive/refs/tags/v${APP_UPSTREAM_VERSION}.tar.gz      https://repo.jellyfin.org/files/server/linux/stable/v${APP_UPSTREAM_VERSION}/${ARCH}/jellyfin_${APP_UPSTREAM_VERSION}-${ARCH}.tar.gz
jellyfin-ffmpeg  GPL-3.0-or-later  https://github.com/jellyfin/jellyfin-ffmpeg/archive/refs/tags/v${FFMPEG_VERSION}.tar.gz     https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${FFMPEG_VERSION}/jellyfin-ffmpeg_${FFMPEG_VERSION}_portable_linux64-gpl.tar.xz
jellyfin-web     GPL-2.0-only      https://github.com/jellyfin/jellyfin-web/archive/refs/tags/v${APP_UPSTREAM_VERSION}.tar.gz  -
libdrm           MIT               -                                                                                           https://dri.freedesktop.org/libdrm/libdrm-${LIBDRM_VERSION}.tar.xz
libva            MIT               -                                                                                           https://github.com/intel/libva/archive/refs/tags/${LIBVA_VERSION}.tar.gz
libva-utils      MIT               -                                                                                           https://github.com/intel/libva-utils/archive/refs/tags/${LIBVA_UTILS_VERSION}.tar.gz
sqlite           blessing          -                                                                                           https://www.sqlite.org/${SQLITE_YEAR}/sqlite-amalgamation-${SQLITE_VERSION}.zip
