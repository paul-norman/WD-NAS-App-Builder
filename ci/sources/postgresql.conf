# The components postgresql's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
debian-archive  n/a                -                                                                                               http://archive.debian.org/debian
debian-archive  n/a                -                                                                                               http://archive.debian.org/debian-security
geos            LGPL-2.1-or-later  https://github.com/libgeos/geos/releases/download/${GEOS_VERSION}/geos-${GEOS_VERSION}.tar.bz2  https://github.com/libgeos/geos/releases/download/${GEOS_VERSION}/geos-${GEOS_VERSION}.tar.bz2
openssl         Apache-2.0         -                                                                                               https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz
pg_cron         PostgreSQL         -                                                                                               https://github.com/citusdata/pg_cron/archive/refs/tags/v${PG_CRON_VERSION}.tar.gz
pg_partman      PostgreSQL         -                                                                                               https://github.com/pgpartman/pg_partman/archive/refs/tags/v${PG_PARTMAN_VERSION}.tar.gz
pgaudit         PostgreSQL         -                                                                                               https://github.com/pgaudit/pgaudit/archive/refs/tags/${PGAUDIT_VERSION}.tar.gz
pgvector        PostgreSQL         -                                                                                               https://github.com/pgvector/pgvector/archive/refs/tags/v${PGVECTOR_VERSION}.tar.gz
postgis         GPL-2.0-or-later   https://download.osgeo.org/postgis/source/postgis-${POSTGIS_VERSION}.tar.gz                     https://download.osgeo.org/postgis/source/postgis-${POSTGIS_VERSION}.tar.gz
postgresql      PostgreSQL         -                                                                                               https://ftp.postgresql.org/pub/source/v${VERSION}/postgresql-${VERSION}.tar.bz2
proj            MIT                -                                                                                               https://download.osgeo.org/proj/proj-${PROJ_VERSION}.tar.gz
