# The components nginx's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
brotli      MIT           -  https://github.com/google/brotli/archive/refs/tags/v${BROTLI_VERSION}.tar.gz
lego        MIT           -  https://github.com/go-acme/lego/releases/download/v${LEGO_VERSION}
nginx       BSD-2-Clause  -  https://nginx.org/download/nginx-${VERSION}.tar.gz
ngx_brotli  BSD-2-Clause  -  https://github.com/google/ngx_brotli/archive/${NGX_BROTLI_COMMIT}.tar.gz
openssl     Apache-2.0    -  https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz
pcre2       BSD-3-Clause  -  https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE2_VERSION}/pcre2-${PCRE2_VERSION}.tar.gz
zlib        Zlib          -  https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz
