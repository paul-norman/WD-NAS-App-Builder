# The components mongodb's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
# MongoDB's own dependencies (its third-party libraries, e.g. its JavaScript engine) are in its source archive; the
# changes made to it are in static/mongodb/build.sh. Bazel fetches its build tools (not shipped)
bazelisk                Apache-2.0  -                                                                 https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64
mongodb                 SSPL-1.0    https://github.com/mongodb/mongo/archive/refs/tags/r${VERSION}.tar.gz  https://github.com/mongodb/mongo/archive/refs/tags/r${VERSION}.tar.gz
mongodb-database-tools  Apache-2.0  -                                                                 https://fastdl.mongodb.org/tools/db/mongodb-database-tools-debian11-x86_64-${TOOLS_VERSION}.tgz
mongosh                 Apache-2.0  -                                                                 https://github.com/mongodb-js/mongosh/releases/download/v${MONGOSH_VERSION}/mongosh-${MONGOSH_VERSION}-linux-x64.tgz
openssl                 Apache-2.0  -                                                                 https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz
