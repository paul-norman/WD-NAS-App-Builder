# The components metube's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
# MeTube's packages come from PyPI (its uv.lock), whose copyleft ones the release finds by itself; Node.js (and pnpm,
# from npm) only build its web interface (not in the package)
metube                   AGPL-3.0-only      https://github.com/alexta69/metube/archive/refs/tags/${VERSION}.tar.gz  https://github.com/alexta69/metube/archive/refs/tags/${VERSION}.tar.gz
ffmpeg                   LGPL-2.1-or-later  https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz  https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz
lame                     LGPL-2.0-or-later  https://downloads.sourceforge.net/project/lame/lame/${LAME_VERSION}/lame-${LAME_VERSION}.tar.gz  https://downloads.sourceforge.net/project/lame/lame/${LAME_VERSION}/lame-${LAME_VERSION}.tar.gz
opus                     BSD-3-Clause       -  https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz
python-build-standalone  PSF-2.0            -  https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_RELEASE}/cpython-${PYTHON_VERSION}+${PYTHON_RELEASE}-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
uv                       MIT OR Apache-2.0  -  https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-musl.tar.gz
node                     MIT                -  https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz
debian-archive           n/a                -  http://archive.debian.org/debian
debian-archive           n/a                -  http://archive.debian.org/debian-security
ffmpeg-debian-copy       n/a                -  https://deb.debian.org/debian/pool/main/f/ffmpeg/ffmpeg_${FFMPEG_VERSION}.orig.tar.xz
ffmpeg-alpine-copy       n/a                -  https://distfiles.alpinelinux.org/distfiles/edge/ffmpeg-${FFMPEG_VERSION}.tar.xz
