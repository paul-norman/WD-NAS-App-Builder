# The components bookstack's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
# BookStack's PHP packages are installed by Composer from its composer.lock (PHP: their source is what's included); the
# copyleft ones are listed with their source releases
bookstack            MIT                -                                                                         https://github.com/BookStackApp/BookStack/archive/refs/tags/v${VERSION}.tar.gz
composer             MIT                -                                                                         https://getcomposer.org/download/${COMPOSER_VERSION}/composer.phar
dompdf               LGPL-2.1           https://github.com/dompdf/dompdf/archive/refs/tags/v3.1.6.tar.gz          -
php-font-lib         LGPL-2.1-or-later  https://github.com/dompdf/php-font-lib/archive/refs/tags/1.0.2.tar.gz     -
php-svg-lib          LGPL-3.0-or-later  https://github.com/dompdf/php-svg-lib/archive/refs/tags/1.0.2.tar.gz      -
htmlpurifier         LGPL-2.1-or-later  https://github.com/ezyang/htmlpurifier/archive/refs/tags/v4.19.1.tar.gz  -
