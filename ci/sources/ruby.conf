# The components ruby's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
debian-archive   n/a                     -                                                    http://archive.debian.org/debian
debian-archive   n/a                     -                                                    http://archive.debian.org/debian-security
ruby             Ruby OR BSD-2-Clause    -                                                    https://cache.ruby-lang.org/pub/ruby/${VERSION%.*}/ruby-${VERSION}.tar.xz
openssl          Apache-2.0              -                                                    https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz
zlib             Zlib                    -                                                    https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz
libyaml          MIT                     -                                                    https://github.com/yaml/libyaml/releases/download/${LIBYAML_VERSION}/yaml-${LIBYAML_VERSION}.tar.gz
libffi           MIT                     -                                                    https://github.com/libffi/libffi/releases/download/v${LIBFFI_VERSION}/libffi-${LIBFFI_VERSION}.tar.gz
mozilla-cacert   MPL-2.0                 https://curl.se/ca/cacert-${CACERT_DATE}.pem         https://curl.se/ca/cacert-${CACERT_DATE}.pem
