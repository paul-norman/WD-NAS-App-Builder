uv                       MIT OR Apache-2.0  -  https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-musl.tar.gz
# Builds the ARM models' run-as helper and Python launcher
zig                      MIT                -  https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz
