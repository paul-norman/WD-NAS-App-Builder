# The components rclone's packages contain and their sources, for its releases (see ci/README.md, Sources):
#     <component>  <license>  <source>  <download>
# <source>: - when none is needed (a permissive license, or not software). <download>: as the build files write it, or
# - (it comes another way)
# (its web interface, rclone-web - MIT - is inside the program: the build saves it as files)
rclone  MIT  -  https://github.com/rclone/rclone/releases/download/v${VERSION}/rclone-v${VERSION}-linux-amd64.zip
rclone  MIT  -  https://github.com/rclone/rclone/releases/download/v${VERSION}/rclone-v${VERSION}-linux-arm-v7.zip
