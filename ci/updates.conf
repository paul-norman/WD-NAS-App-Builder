# Where each app's upstream releases are, for the daily update check (ci/updates.py, see README.md, Updates). One line
# per app:
#     <app>  <feed>  <source>  [<option>=<value> ...]
# <feed>: github (its GitHub releases, drafts and pre-releases left out), tags (its git tags - <source> owner/repo on
# GitHub, or a git URL), listing (the file names in a download folder's page, by its match), pypi, npm (a package),
# nodejs (Node.js's own list), none (not checked: the reason above it).
# Options:
#     match=<regex>          the tags or versions that are releases, the version in its groups (default ^v?(\d+(?:\.\d+)+)$)
#     version=<format>       the version from the groups: {1}, {2}... (default {1})
#     line=<prefix>          only versions on this line (e.g. 15 for an LTS line, 8.0)
#     static=no              its static build's VERSION is something else (not the app's version)
#     set.<VAR>=<format>     another value its version sets, from the groups (e.g. set.OPENSSH_VERSION={1}.{2}p{3})
#     pin.<VAR>=<url>        a checksum its own build.sh checks, of this address ({version}: the new version)
#     wheel=<VAR>            its build.sh's pin of its PyPI wheel's SHA256 (as PyPI publishes it)
#     manual=yes             never merged by itself (system apps, and those whose update needs more than a version)
# Pre-releases (alpha, beta, rc, dev...) are left out whatever the feed. An update merges by itself only if it's a
# patch or minor one, the app has a test suite of its own, it isn't manual=yes, and its release is 24 hours old (or a
# security fix)

adminer            github  vrana/adminer
audiobookshelf     github  advplyr/audiobookshelf
bookstack          github  BookStackApp/BookStack
bugsink            pypi    bugsink                              wheel=BUGSINK_WHEEL_SHA256
calibre-web        pypi    calibreweb                           wheel=CW_WHEEL_SHA256  manual=yes
compass-web        npm     compass-web
copyparty          pypi    copyparty                            wheel=CPP_WHEEL_SHA256
# Docker's engine (download.docker.com); its static build is WD's kernel modules - and it replaces part of the NAS
docker             github  moby/moby                            match=^docker-v(\d+\.\d+\.\d+)$  static=no  manual=yes
# A date: the version of the app itself, not of Entware
entware            none    -
forgejo            tags    https://codeberg.org/forgejo/forgejo.git  line=15
golang             tags    golang/go                            match=^go(\d+\.\d+\.\d+)$
grafana            github  grafana/grafana
# Its static build copies the program from Headlamp's image, pinned by digest (the image check updates both)
headlamp           github  kubernetes-sigs/headlamp             manual=yes
icecast            tags    https://gitlab.xiph.org/xiph/icecast-server.git
jellyfin           github  jellyfin/jellyfin
k3s                github  k3s-io/k3s                           match=^v(\d+\.\d+\.\d+)\+k3s\d+$  manual=yes
kopia              github  kopia/kopia
kvweb              github  natrimmer/kvweb
loki               github  grafana/loki
mailpit            github  axllent/mailpit
# MariaDB's long-term line; it replaces WD's MariaDB under WD's own scripts
mariadb            tags    MariaDB/server                       match=^mariadb-(\d+\.\d+\.\d+)$  line=11.8  manual=yes
memos              github  usememos/memos
miniflux           github  miniflux/v2
# 8.0's line: a new major version needs MongoDB's data upgraded one step at a time - and a long build without AVX
mongodb            tags    mongodb/mongo                        match=^r(\d+\.\d+\.\d+)$  line=8.0
music-assistant    github  music-assistant/server
mysqld_exporter    github  prometheus/mysqld_exporter
nano               tags    https://git.savannah.gnu.org/git/nano.git
navidrome          github  navidrome/navidrome
# A new major version only one at a time (Nextcloud upgrades one major version at a time)
nextcloud          github  nextcloud/server                     line=35
# Nginx's stable line (even minor versions); it fronts every app
nginx              tags    nginx/nginx                          match=^release-(\d+\.\d+\.\d+)$  line=1.30  manual=yes
node_exporter      github  prometheus/node_exporter
# The Node.js app follows Node.js's current line
nodejs             nodejs  -                                    line=26  pin.NODE_SHA256[x64]=https://nodejs.org/dist/v{version}/node-v{version}-linux-x64.tar.xz
ntfy               github  binwiederhier/ntfy
# OpenSSH's portable releases (its patch releases aren't always tagged); it replaces the NAS's own SSH server
openssh            listing https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/  match=^openssh-(\d+)\.(\d+)p(\d+)\.tar\.gz$  version={1}.{2}.{3}  set.OPENSSH_VERSION={1}.{2}p{3}  manual=yes
paperless-ngx      github  paperless-ngx/paperless-ngx
pgweb              github  sosedoff/pgweb
# PHP's line; it replaces the NAS's own PHP
php                tags    php/php-src                          match=^php-(\d+\.\d+\.\d+)$  line=8.5  manual=yes
phpbb              tags    phpbb/phpbb                          match=^release-(\d+\.\d+\.\d+)$  line=3.3
phpMyAdmin         tags    phpmyadmin/phpmyadmin                match=^RELEASE_(\d+)_(\d+)_(\d+)$  version={1}.{2}.{3}
postgres_exporter  github  prometheus-community/postgres_exporter
# PostgreSQL's major version: a new one needs its data upgraded
postgresql         tags    postgres/postgres                    match=^REL_(\d+)_(\d+)$  version={1}.{2}  line=18  manual=yes
prometheus         github  prometheus/prometheus
# Python's builds are released with their own tag (a date): the shared-parts check updates it
python             none    -
# Its static builds' releases (release-<qBittorrent>_v<libtorrent>): the program the app ships
qbittorrent        github  userdocs/qbittorrent-nox-static      match=^release-(\d+\.\d+\.\d+)_v(\d+\.\d+\.\d+)$  set.LIBTORRENT_VERSION={2}
rclone             github  rclone/rclone
redis_exporter     github  oliver006/redis_exporter
ruby               tags    ruby/ruby                            line=4.0
# This project's own app
scrutiny           github  AnalogJ/scrutiny
store              none    -
syncthing          github  syncthing/syncthing
tailscale          github  tailscale/tailscale
tautulli           github  Tautulli/Tautulli
template           none    -
transmission       github  transmission/transmission
uptime-kuma        github  louislam/uptime-kuma
valkey             github  valkey-io/valkey
# Its static build copies the program from Vaultwarden's image (pinned by digest) with its web vault's version: the image
# check updates them
vaultwarden        github  dani-garcia/vaultwarden              manual=yes
wikijs             github  requarks/wiki
wireguard          tags    https://git.zx2c4.com/wireguard-go   match=^v?(0\.0\.\d{8})$
