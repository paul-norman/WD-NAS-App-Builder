# The test suites CI runs for each app and recipe (see README.md), as well as the shared package test (tests/apps),
# which every app gets. One line per command:
#
#     <name>  <needs>  <command>
#
# where <name> is an app, or recipe:<id>; <needs> lists the other apps whose packages the suite uses, comma separated
# (- for none); and <command> runs from the repository's root. A name with several lines runs each of them.
#
# Apps with a suite on tests/common (tests/<app>/test_app.sh) need no line: they run
# `tests/common/run.sh <app> --php both`, with the apps listed in tests/<app>/with.

audiobookshelf     -                                tests/audiobookshelf/run_tests.sh all --php both
calibre-web        -                                tests/calibre-web/run_tests.sh all --php both
copyparty          -                                tests/copyparty/run_tests.sh all --php both
icecast            -                                tests/icecast/run_tests.sh all --php both
nginx              php                              tests/nginx/run_tests.sh --php both
php                -                                tests/php/run_tests.sh
wireguard          -                                tests/wireguard/run_tests.sh all --php 7.4
wireguard          -                                tests/wireguard/run_tests.sh app --php 8.5
store              docker,nginx,nano,python,php     tests/store/run_tests.sh repos_apps --php both
store              docker,nginx,nano,python,php     tests/store/run_tests.sh recipes --php both
store              docker,nginx,nano,python,php     tests/store/run_tests.sh signatures --php both

# The recipes, installed through the Store (each pulls its images: GBs for Immich and the Arr stack)
recipe:immich      store,docker,nginx,nano,python   tests/store/run_tests.sh immich
recipe:pihole      store,docker,nginx,nano,python   tests/store/run_tests.sh pihole
recipe:arr         store,docker,nginx,nano,python   tests/store/run_tests.sh arr
