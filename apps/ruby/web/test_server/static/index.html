<!DOCTYPE html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Cache-Control" content="no-cache">
	<title>Ruby is Running!</title>
	<style>
		html, body { margin: 0; padding: 0; height: 100%; }
		body { background-color: rgba(204, 52, 45, 0.85); font-family: sans-serif; color: #fff; }
		.center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; max-width: 90%; }
		h1 { margin: 0 0 1rem; font-size: 3rem; }
		p { margin: 0.4rem 0; }
		code { font-size: 0.95em; }
	</style>
</head>
<body>
	<div class="center">
		<h1>Ruby is Running!</h1>
		<p><code>{ruby}</code></p>
		<p>With {openssl}, libyaml {libyaml} and zlib {zlib}.</p>
	</div>
</body>
</html>
