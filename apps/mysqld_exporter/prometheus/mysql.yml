# The MariaDB Exporter app's scrape job, for the Prometheus app (which copies it into its own configuration, with
# @INSTANCE@ as the NAS's name - as its other jobs' instance label)
scrape_configs:
  - job_name: mysql
    static_configs:
      - targets: ['127.0.0.1:9104']
        labels:
          instance: '@INSTANCE@'
