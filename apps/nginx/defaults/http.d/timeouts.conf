keepalive_timeout        65;

# Proxied apps: long enough for idle WebSocket connections (e.g. Jellyfin, Portainer's console)
proxy_read_timeout       300;
proxy_send_timeout       300;
proxy_connect_timeout    5;

# Upstream (PHP)
#fastcgi_read_timeout    60;  # Getting info from PHP FPM
#fastcgi_send_timeout    60;  # Sending info to PHP FPM
#fastcgi_connect_timeout 5;   # Connecting to PHP FPM

# Normal requests
#send_timeout            60;  # Client response timeout
#client_header_timeout   30;  # Reading client input headers
#client_body_timeout     120; # Reading client input body (i.e. upload timeout)
