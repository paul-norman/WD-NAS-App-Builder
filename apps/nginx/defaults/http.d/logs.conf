log_format standard '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

# Off by default: logging every request writes to the NAS's disks all the time (so they never spin down). The error
# log (set in nginx.conf) stays on
access_log off;
#access_log logs/access.log standard;
