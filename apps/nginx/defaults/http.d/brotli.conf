# Brotli compresses better than gzip: browsers that accept it get Brotli, the others gzip
brotli            on;
brotli_static     on;
brotli_comp_level 5;
brotli_min_length 256;
brotli_buffers    16 8k;
brotli_window     512k;
brotli_types      application/javascript
                  application/json
                  application/manifest+json
                  application/vnd.ms-fontobject
                  application/xml
                  application/xml+rss
                  font/opentype
                  font/ttf
                  image/svg+xml
                  image/x-icon
                  text/css
                  text/javascript
                  text/plain
                  text/xml;
# text/html is ALWAYS included and does not need to be specified here
