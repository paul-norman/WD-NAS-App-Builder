gzip              on;
gzip_static       on;
gzip_vary         on;
gzip_proxied      any;
gzip_min_length   256;
gzip_comp_level   5;
gzip_buffers      16 8k;
gzip_http_version 1.0;
gzip_types        application/javascript
                  application/json
                  application/manifest+json
                  application/vnd.ms-fontobject
                  application/xml
                  application/xml+rss
                  font/opentype
                  font/ttf
                  image/svg+xml
                  text/css
                  text/javascript
                  text/plain
                  text/xml;
# text/html is ALWAYS included and does not need to be specified here
