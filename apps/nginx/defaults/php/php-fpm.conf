; PHP for the sites (server.d/php.conf), from the PHP app: a php-fpm of its own - separate from the NAS's (which runs
; WD's web interface as root) - running as the unprivileged nobody user (as Nginx's workers do; it exists on every NAS).
; __DATA_PATH__ is replaced on setup.

[global]
pid       = __DATA_PATH__/logs/php-fpm.pid
error_log = __DATA_PATH__/logs/php-fpm.log
log_level = warning
daemonize = yes

[sites]
; (its group: nobody's own)
user = nobody

; Only Nginx's worker processes (nobody) can connect
listen       = /var/run/nginx-php.sock
listen.owner = nobody
listen.mode  = 0600

; Workers start when requests come in, and stop after a minute without any (the NAS's memory is limited)
pm                      = ondemand
pm.max_children         = 8
pm.process_idle_timeout = 60s
pm.max_requests         = 500

catch_workers_output     = yes
decorate_workers_output  = no
security.limit_extensions = .php
