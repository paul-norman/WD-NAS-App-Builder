; PHP settings for the sites (not the NAS's own PHP, which uses /etc/php/php.ini). __DATA_PATH__ and __TIMEZONE__ are
; replaced on setup.

[PHP]
engine                 = On
short_open_tag         = Off
expose_php             = Off
memory_limit           = 256M
max_execution_time     = 60
max_input_time         = 60
; As big as Nginx allows (http.d/size-limits.conf)
post_max_size          = 512M
upload_max_filesize    = 512M
max_file_uploads       = 50
allow_url_fopen        = On
realpath_cache_size    = 4096K
cgi.fix_pathinfo       = 0

error_reporting        = E_ALL & ~E_DEPRECATED
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = __DATA_PATH__/logs/php-errors.log

date.timezone          = __TIMEZONE__

session.save_path       = __DATA_PATH__/php/sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure   = 1
session.cookie_samesite = Lax

opcache.enable                 = 1
opcache.memory_consumption     = 64
opcache.max_accelerated_files  = 20000
opcache.validate_timestamps    = 1
opcache.revalidate_freq        = 2
