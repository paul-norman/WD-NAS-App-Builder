# Nginx's main configuration: only a skeleton - everything else is in the folders it includes, named after the block
# they are included in (modules: the top level, http.d: http, server.d: server blocks, ssl.d: certificates). Every
# included file ends in .conf, so renaming a file (e.g. to .conf.off) switches it off.

worker_processes auto;
user             nobody nogroup;
pid              logs/nginx.pid;
error_log        logs/error.log warn;
include          modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include http.d/*.conf;
    include sites/*.conf;
}
