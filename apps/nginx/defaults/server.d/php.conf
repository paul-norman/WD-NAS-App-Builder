# PHP files, run by the sites' php-fpm (php/php-fpm.conf - needs the PHP app). Missing files are a 404, rather than
# being handed to PHP
location ~ \.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    try_files               $fastcgi_script_name =404;
    fastcgi_pass            unix:/var/run/nginx-php.sock;
    fastcgi_index           index.php;
    include                 params/fastcgi.conf;
    fastcgi_param           PATH_INFO $fastcgi_path_info;
}
