# HTTPS (with HTTP/2 and HTTP/3), using the default certificate - included at the top of each site's server block. For
# IPv6 too, add: listen [::]:443 ssl; and listen [::]:443 quic; (only if the NAS has IPv6 enabled - Nginx won't start
# otherwise)
listen     443 ssl;
listen     443 quic;
http2      on;
add_header Alt-Svc 'h3=":443"; ma=86400' always;

include    ssl.d/default.conf;
