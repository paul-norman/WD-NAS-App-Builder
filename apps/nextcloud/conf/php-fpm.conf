; Nextcloud's PHP (written by the app at every start from its conf/php-fpm.conf - changes here are lost): the PHP app's
; php-fpm, run as Nextcloud's user under a name of its own (nextcloud-php-fpm: WD's php-fpm.sh finds its own php-fpm by
; its file name). Only Nextcloud's web server connects (its socket is in its run folder). __...__ are filled in by
; nextcloud_ctl.sh.

[global]
error_log = __DATA__/logs/php-fpm.log
log_level = warning
daemonize = no

[nextcloud]
listen      = __DATA__/run/php-fpm.sock
listen.mode = 0600

; Workers start when requests come in, and stop after a minute without any (the NAS's memory is shared with everything
; else); a sync client's burst of uploads gets up to 8 at once
pm                      = ondemand
pm.max_children         = 8
pm.process_idle_timeout = 60s
pm.max_requests         = 500

; Nextcloud reads these (its PATH: for its own programs' checks; its configuration's folder)
clear_env = no
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[NEXTCLOUD_CONFIG_DIR] = __DATA__/config

catch_workers_output      = yes
decorate_workers_output   = no
security.limit_extensions = .php
