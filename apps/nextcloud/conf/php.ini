; Nextcloud's PHP settings (written by the app at every start from its conf/php.ini - changes here are lost): for its web
; server's php-fpm and its console (occ, and its background jobs). __...__ are filled in by nextcloud_ctl.sh.
date.timezone = __TIMEZONE__
memory_limit = 512M
max_execution_time = 3600
max_input_time = 3600
upload_max_filesize = 16G
post_max_size = 16G
output_buffering = 0
expose_php = Off
default_charset = UTF-8

; Its logs (Nextcloud has its own, nextcloud.log: these are PHP's)
display_errors = Off
log_errors = On
error_log = __DATA__/logs/php-errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; Sessions and uploads on their way in: with its data
session.save_path = __DATA__/run/sessions
upload_tmp_dir = __DATA__/run/uploads
sys_temp_dir = __DATA__/run/tmp

; OPcache, as Nextcloud recommends it (its code changes only with the app's updates)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.jit = off

; APCu: Nextcloud's local memory cache - for its console too (its background jobs use it)
apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 64M
