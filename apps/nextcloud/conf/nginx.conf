# Nextcloud's own web server (written by the app at every start from its conf/nginx.conf - changes here are lost): the
# Nginx app's program, run as Nextcloud's user, serving Nextcloud with its PHP (php-fpm) - adapted from Nextcloud's own
# recommended configuration. HTTPS is the Nginx app's (its site passes visitors on to this one); on the local network,
# plain HTTP when the app's settings allow it. __...__ are filled in by nextcloud_ctl.sh.
worker_processes 2;
pid              __DATA__/run/nginx.pid;
error_log        __DATA__/logs/nginx-error.log warn;

events {
    worker_connections 512;
}

http {
    include      __NGINX_PARAMS__/mime.types;
    default_type application/octet-stream;
    # (JavaScript modules: not in Nginx's own list)
    types {
        text/javascript mjs;
    }

    access_log off;
    sendfile   on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;

    # Its temporary files in its own data (the Nginx app's are elsewhere)
    client_body_temp_path __DATA__/run/client_body;
    proxy_temp_path       __DATA__/run/proxy;
    fastcgi_temp_path     __DATA__/run/fastcgi;
    uwsgi_temp_path       __DATA__/run/uwsgi;
    scgi_temp_path        __DATA__/run/scgi;

    # Visitors' own addresses, from the Nginx app (on the NAS itself) - Nextcloud reads them too (its trusted_proxies)
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    upstream php-handler {
        server unix:__DATA__/run/php-fpm.sock;
    }

    # Assets asked for with their version (?v=...) never change: browsers may keep them as they are
    map $arg_v $asset_immutable {
        ""      "";
        default ", immutable";
    }

    server {
        listen __LISTEN__;
        server_name _;

        root __NEXTCLOUD__;

        # Redirects keep the address the visitor used (the Nginx app's HTTPS site, or this port)
        absolute_redirect off;
        index index.php index.html /index.php$request_uri;

        # Uploads: up to the PHP's limit, passed on as they come (the desktop and phone apps upload in chunks)
        client_max_body_size    16G;
        client_body_buffer_size 512k;
        client_body_timeout     300s;
        fastcgi_buffers         64 4K;

        gzip on;
        gzip_vary on;
        gzip_comp_level 4;
        gzip_min_length 256;
        gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
        gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

        add_header Referrer-Policy                   "no-referrer"       always;
        add_header X-Content-Type-Options            "nosniff"           always;
        add_header X-Frame-Options                   "SAMEORIGIN"        always;
        add_header X-Permitted-Cross-Domain-Policies "none"              always;
        add_header X-Robots-Tag                      "noindex, nofollow" always;

        fastcgi_hide_header X-Powered-By;

        # WebDAV clients that ask for the root (e.g. Windows' "Map network drive") go to Nextcloud's WebDAV
        location = / {
            if ( $http_user_agent ~ ^DavClnt ) {
                return 302 /remote.php/webdav/$is_args$args;
            }
        }

        location = /robots.txt {
            allow all;
            log_not_found off;
        }

        # Calendars, contacts and other well-known addresses
        location ^~ /.well-known {
            location = /.well-known/carddav { return 301 /remote.php/dav/; }
            location = /.well-known/caldav  { return 301 /remote.php/dav/; }
            location /.well-known/acme-challenge    { try_files $uri $uri/ =404; }
            location /.well-known/pki-validation    { try_files $uri $uri/ =404; }
            return 301 /index.php$request_uri;
        }

        # Never served: its code's own folders, and dot files
        location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/)  { return 404; }
        location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)                { return 404; }

        # PHP: its scripts, with their path info
        location ~ \.php(?:$|/) {
            rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|ocs-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            set $path_info $fastcgi_path_info;

            try_files $fastcgi_script_name =404;

            include __NGINX_PARAMS__/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_pass php-handler;

            fastcgi_intercept_errors on;
            fastcgi_request_buffering off;
            fastcgi_read_timeout 3600s;
            fastcgi_max_temp_file_size 0;
        }

        # Its own assets, cached by browsers
        location ~ \.(?:css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|tflite|map|ogg|flac)$ {
            try_files $uri /index.php$request_uri;
            add_header Cache-Control "public, max-age=15778463$asset_immutable";
            add_header Referrer-Policy                   "no-referrer"       always;
            add_header X-Content-Type-Options            "nosniff"           always;
            add_header X-Frame-Options                   "SAMEORIGIN"        always;
            add_header X-Permitted-Cross-Domain-Policies "none"              always;
            add_header X-Robots-Tag                      "noindex, nofollow" always;
            access_log off;
        }

        location ~ \.(otf|woff2?)$ {
            try_files $uri /index.php$request_uri;
            expires 7d;
            access_log off;
        }

        # Apps installed from its app store: kept with its data (they survive the app's updates)
        location ^~ /custom_apps/ {
            alias __DATA__/custom_apps/;

            location ~ \.php(?:$|/) {
                return 404;
            }

            try_files $uri /index.php$request_uri;
        }

        location /remote {
            return 301 /remote.php$request_uri;
        }

        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }
    }
}
