# The daily update check (ci/updates.py, settings in ci/updates.conf - see ci/README.md, Updates): a pull request per
# app with a newer upstream release, made with the bot's token so that build-test-release builds and tests it; those the
# policy allows (patch or minor updates, 24 hours after their release - at once for security fixes) are merged once it
# has passed. The full check runs twice a day; the merging alone (updates.py merge) runs as soon as CI finishes on an
# update pull request, and every 3 hours for those waiting to be old enough. The bot may bypass main's rules, so it
# checks CI's result itself rather than use GitHub's auto-merge (it would merge at once); its merge starts the release
# run. Can also be run by hand (Actions -> updates).
name: updates

on:
  schedule:
    # The full check
    - cron: '41 5,17 * * *'
    # The merging alone
    - cron: '11 */3 * * *'
  # CI finished on a pull request: an update's is merged straight away if it may be
  workflow_run:
    workflows: [build-test-release]
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: 'At most this many pull requests made or changed'
        required: false
        default: '10'

permissions:
  contents: read

concurrency:
  group: updates
  cancel-in-progress: false

jobs:
  updates:
    # After CI: only on an update pull request's run that passed (the code run is always main's, never the pull
    # request's)
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.conclusion == 'success'
          && startsWith(github.event.workflow_run.head_branch, 'update/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # full (the whole check) or merge (only the merging)
      MODE: ${{ (github.event_name == 'workflow_run' || github.event.schedule == '11 */3 * * *') && 'merge' || 'full' }}
    steps:
      # The bot's token: its pull requests run CI, and its merges the release run (the workflow's own token's don't)
      - name: The bot's token
        id: bot
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      # An update that needs its lock file written again runs its static build (Docker)
      - name: Free disk space
        if: env.MODE == 'full'
        run: bash ci/free_disk.sh

      - name: Merge what may be merged
        if: env.MODE == 'merge'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          # The pull request whose CI just finished (none on the schedule: all of them)
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        # (A feed that fails here doesn't fail the run: the full check reports it, without an email every 3 hours)
        run: python3 ci/updates.py merge ${BRANCH:+"${BRANCH}"}

      - name: Pull requests for the updates
        if: env.MODE == 'full'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${BOT_SLUG}[bot]@users.noreply.github.com"
          python3 ci/updates.py run --limit "${{ inputs.limit || '10' }}" | tee "${RUNNER_TEMP}/updates.log"
          {
              echo '## Updates'
              python3 ci/updates.py check | sed 's/^/- /'
          } >> "${GITHUB_STEP_SUMMARY}"

          # Problems (a feed that failed, an update that couldn't be made) fail the run: GitHub emails about it
          if grep -q '^PROBLEM' "${RUNNER_TEMP}/updates.log"; then
              exit 1
          fi
