# Google Chrome for the changedetection.io app, on a WD My Cloud NAS (OS5, Intel models): the browser it drives (through
# Patchright) for pages that need one. It's Selenium's official image - for its Google Chrome and virtual display (Xvfb)
# - with its start replaced by this file's own (Selenium itself isn't run):
#  - Chrome with a window, on the virtual display (a headless Chrome is easier for sites to tell apart), its DevTools
#    port on the NAS itself only (127.0.0.1:9222 - host networking: Chrome only listens on its own 127.0.0.1)
#  - started with Patchright's own Chrome switches - as Patchright would start it: --disable-blink-features=
#    AutomationControlled, and none of the ones that give automation away (--enable-automation...)
#  - restarted if it stops; a fresh profile each time the container starts
#  - Chrome's version matched to the app's Patchright (156: Patchright 1.64), the image pinned (version and digest)
#  - its memory capped, and its logs
#
# Run it from the folder holding this file and its .env (setup.sh puts both in
# /mnt/HD/HD_a2/Nas_Prog/_changedetection-browser).

name: changedetection-browser

services:
  chrome:
    container_name: changedetection-browser
    image: selenium/standalone-chrome:156.0-20261101@sha256:0ca0737a35399adcf5c7221a02dffe9f41dc1f3aea8a1a44866c52917e91ad5b
    # Its DevTools port on the NAS itself only: nothing on the network can drive it
    network_mode: host
    environment:
      # The time zone pages see (one not matching the address's country gives a browser away)
      TZ: ${TZ}
      DISPLAY: ':99'
    # (Selenium's start replaced: Xvfb, then Chrome - started again whenever it stops)
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > /tmp/xvfb.log 2>&1 &
        sleep 2
        google-chrome --version
        while true; do
            rm -rf /tmp/chrome-profile
            google-chrome --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-profile --no-sandbox \
                --window-size=1920,1080 --disable-field-trial-config --disable-background-networking \
                --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-breakpad \
                --no-default-browser-check --disable-dev-shm-usage --disable-hang-monitor --disable-prompt-on-repost \
                --disable-renderer-backgrounding --force-color-profile=srgb --no-first-run --password-store=basic \
                --use-mock-keychain --no-service-autorun --export-tagged-pdf --disable-search-engine-choice-screen \
                --disable-infobars --disable-sync --disable-blink-features=AutomationControlled \
                --enable-features=CDPScreenshotNewSurface \
                --disable-features=AvoidUnnecessaryBeforeUnloadCheckSync,DestroyProfileOnBrowserClose,DialMediaRouteProvider,GlobalMediaControls,HttpsUpgrades,LensOverlay,PaintHolding,ThirdPartyStoragePartitioning,BlockOriginHeaderModificationOnRedirect,AvoidCorsURLLoaderRestartOnRedirect,Translate,AutoDeElevate,OptimizationHints,NetworkTimeServiceQuerying,AimEnabled \
                about:blank
            echo "Chrome stopped ($$?) - starting it again"
            sleep 5
        done
    shm_size: '256m'
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:9222/json/version']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
