# The "arr" stack on a WD My Cloud NAS (OS5, Intel models): request films and TV (Seerr), find them (Prowlarr, with
# FlareSolverr optionally), download them (qBittorrent, SABnzbd optionally), file them into the library (Sonarr, Radarr,
# and optionally Lidarr for music and Bookshelf for books) with subtitles (Bazarr). The library is for the NAS's own
# Jellyfin, Emby or Plex (native apps, not part of this recipe). Optionally, quality rules from the TRaSH Guides
# (Recyclarr).
#
# Based on the images' own examples (LinuxServer.io's for most), with:
#  - one data folder (DATA_ROOT) mounted at /data in every container: downloads (torrents/, usenet/) and the library
#    (media/) on one file system, so finished downloads are hard-linked into the library rather than copied. Library
#    folders of the user's own elsewhere (TV_FOLDERS...) are mounted at /media/<their path> by the Store
#    (compose.override.yaml) - finished downloads are copied into those
#  - everything running as one user in the NAS's share group (PUID/PGID, umask 002): the library can be changed over SMB
#  - the API keys generated by the Store (in .env), so the recipe's hook can connect everything (hooks/wire.py)
#  - the optional services switched on and off by profiles named after .env settings (on/off): COMPOSE_PROFILES=on
#  - images pinned (version and digest), container logs capped
#
# Run it from the folder holding this file and its .env (the Store puts both in /mnt/HD/HD_a2/Nas_Prog/_arr).

name: arr

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

# The NAS itself, as host.docker.internal: its own Jellyfin, Emby or Plex, and ntfy (native apps) - for the apps telling
# the media server about new files, and sending notifications
x-nas: &nas
  extra_hosts:
    - 'host.docker.internal:host-gateway'

x-linuxserver: &linuxserver
  PUID: ${PUID}
  PGID: ${PGID}
  UMASK: '002'
  TZ: ${TZ}

services:
  qbittorrent:
    <<: *common
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:5.3.0@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
    environment:
      <<: *linuxserver
      WEBUI_PORT: 8090
      TORRENTING_PORT: ${TORRENT_PORT}
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    ports:
      - '8090:8090'
      - '${TORRENT_PORT}:${TORRENT_PORT}'
      - '${TORRENT_PORT}:${TORRENT_PORT}/udp'

  prowlarr:
    <<: [*common, *nas]
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.6.5@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    environment:
      <<: *linuxserver
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - '9696:9696'

  sonarr:
    <<: [*common, *nas]
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9
    environment:
      <<: *linuxserver
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - '8989:8989'

  radarr:
    <<: [*common, *nas]
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.4.4@sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1
    environment:
      <<: *linuxserver
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - '7878:7878'

  bazarr:
    <<: *common
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:1.6.2@sha256:946dc8c5bb5331418eac60050cf40a63cb8f66ac039841dda493870e3559799c
    environment:
      <<: *linuxserver
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - '6767:6767'

  seerr:
    <<: [*common, *nas]
    container_name: seerr
    image: docker.io/seerr/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    user: '${PUID}:${PGID}'
    init: true
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    ports:
      - '5055:5055'

  # Optional: music
  lidarr:
    <<: [*common, *nas]
    container_name: lidarr
    profiles: ['${LIDARR:-off}']
    image: lscr.io/linuxserver/lidarr:3.1.0@sha256:d8549ff9ea29b4015c32257360652c1000c31ea471a2b3f0835ae77292faf35b
    environment:
      <<: *linuxserver
      LIDARR__AUTH__APIKEY: ${LIDARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/lidarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - '8686:8686'

  # Optional: books (Bookshelf, a continuation of Readarr with Hardcover's book data)
  bookshelf:
    <<: [*common, *nas]
    container_name: bookshelf
    profiles: ['${BOOKS:-off}']
    image: ghcr.io/pennydreadful/bookshelf:hardcover-v0.4.21.182@sha256:67498dd5ece516867d72ee642abd6c1a66b36a135c8f7da0127109564372beb1
    environment:
      <<: *linuxserver
      READARR__AUTH__APIKEY: ${BOOKSHELF_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/bookshelf:/config
      - ${DATA_ROOT}:/data
    ports:
      - '8787:8787'

  # Optional: Usenet downloads (needs a Usenet provider's account)
  sabnzbd:
    <<: *common
    container_name: sabnzbd
    profiles: ['${SABNZBD:-off}']
    image: lscr.io/linuxserver/sabnzbd:5.1.3@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01
    environment:
      <<: *linuxserver
    volumes:
      - ${CONFIG_ROOT}/sabnzbd:/config
      - ${DATA_ROOT}:/data
    ports:
      - '8085:8080'

  # Optional: gets Prowlarr past Cloudflare's checks on some indexers (no port on the NAS: only Prowlarr uses it)
  flaresolverr:
    <<: *common
    container_name: flaresolverr
    profiles: ['${FLARESOLVERR:-off}']
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info

  # Optional: quality rules from the TRaSH Guides, applied to Sonarr's and Radarr's profiles every day (its settings are
  # written by the recipe's hook: recyclarr/recyclarr.yml - the API keys come from here)
  recyclarr:
    <<: *common
    container_name: recyclarr
    profiles: ['${RECYCLARR:-off}']
    image: ghcr.io/recyclarr/recyclarr:8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
    user: '${PUID}:${PGID}'
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: '@daily'
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
    volumes:
      - ${CONFIG_ROOT}/recyclarr:/config
